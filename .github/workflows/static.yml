# 离线静态门（CI）——不需要 Minecraft / Java / 服务器，本机实测 < 2s。
#
# 覆盖：pack.mcmeta 与全部 .json 可解析 · 函数/函数标签引用闭包 · L4·L7·L9–L13（每条都对应一次真机
#       「Failed to load function」）· 宏文件的 `with` 来源 · 仓库顶层白名单与泄漏 · 发行 zip 可复现。
# 不含：`/reload` 的加载期门、真机/多玩家压测（需要 Fabric 服务端与真客户端，测试台在私有开发仓库）。
name: static

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 静态门（JSON / 引用闭包 / mcfunction 加载期规则 / 宏 with 来源）
        run: node src/tools/check_static.mjs

      - name: 结构门（泄漏扫描 + 顶层白名单）
        run: node src/tools/check_leak.mjs

      - name: 发行物可复现（dist 的 zip 与现在重新打一次逐字节一致）
        run: node src/tools/make_dist.mjs --check

      - name: 失败时输出编辑器注解
        if: failure()
        run: node src/tools/check_static.mjs --vscode || true
